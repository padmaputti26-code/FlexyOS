plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flexyos.c71'
    compileSdk 35

    defaultConfig {
        applicationId 'com.flexyos.c71'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
